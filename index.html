<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="跨境商品视觉资产库的局域网网页设计原型。"
    />
    <title>素材库 · 视觉资产浏览</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --canvas: #eef6ff;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-soft: rgba(232, 243, 255, 0.72);
        --panel-strong: rgba(255, 255, 255, 0.86);
        --text: #17334d;
        --muted: #55718b;
        --subtle: #7d96ad;
        --border: rgba(71, 125, 173, 0.24);
        --accent: #247dcc;
        --accent-strong: #115f9f;
        --accent-soft: rgba(205, 229, 255, 0.78);
        --warm: #c36a33;
        --warm-soft: rgba(253, 226, 211, 0.78);
        --glass: rgba(255, 255, 255, 0.58);
        --glass-strong: rgba(255, 255, 255, 0.82);
        --field-a: rgba(112, 183, 250, 0.22);
        --field-b: rgba(88, 143, 220, 0.18);
        --field-c: rgba(244, 184, 104, 0.12);
        --shadow: 0 18px 50px rgba(31, 91, 145, 0.14);
        --shadow-soft: 0 10px 28px rgba(31, 91, 145, 0.1);
      }

      [data-theme="dark"] {
        color-scheme: dark;
        --canvas: #0e1d2c;
        --panel: rgba(23, 43, 62, 0.7);
        --panel-soft: rgba(32, 58, 79, 0.68);
        --panel-strong: rgba(32, 54, 76, 0.88);
        --text: #edf6ff;
        --muted: #abc3da;
        --subtle: #839db7;
        --border: rgba(156, 198, 235, 0.16);
        --accent: #79bcff;
        --accent-strong: #b5ddff;
        --accent-soft: rgba(24, 59, 92, 0.78);
        --warm: #f2a36d;
        --warm-soft: rgba(73, 45, 31, 0.78);
        --glass: rgba(16, 35, 56, 0.54);
        --glass-strong: rgba(23, 45, 67, 0.8);
        --field-a: rgba(83, 166, 238, 0.18);
        --field-b: rgba(79, 128, 193, 0.2);
        --field-c: rgba(227, 158, 86, 0.1);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        --shadow-soft: 0 14px 38px rgba(0, 0, 0, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--canvas);
      }

      body {
        position: relative;
        isolation: isolate;
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(1100px 680px at 16% -8%, var(--field-a), transparent 62%),
          radial-gradient(900px 620px at 88% 4%, var(--field-b), transparent 60%),
          radial-gradient(980px 700px at 72% 112%, var(--field-c), transparent 65%),
          linear-gradient(140deg, color-mix(in srgb, var(--canvas) 94%, #ffffff), var(--canvas));
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        line-height: 1.45;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(115deg, transparent 0 18%, color-mix(in srgb, var(--field-a) 48%, transparent) 42%, transparent 68%),
          linear-gradient(28deg, transparent 0 36%, color-mix(in srgb, var(--field-b) 45%, transparent) 58%, transparent 84%);
        content: "";
        filter: blur(34px);
        opacity: 0.78;
        pointer-events: none;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .app-shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        grid-template-columns: minmax(190px, 250px) minmax(260px, 1fr) auto;
        align-items: center;
        min-height: 68px;
        gap: 24px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--glass-strong) 82%, transparent);
        backdrop-filter: blur(26px) saturate(145%);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.22), var(--shadow-soft);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid var(--accent);
        border-radius: 7px;
        background: linear-gradient(145deg, var(--accent-soft), color-mix(in srgb, var(--panel) 72%, transparent));
        color: var(--accent-strong);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
      }

      .brand-mark svg {
        width: 18px;
        height: 18px;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-name {
        display: block;
        font-weight: 760;
        font-size: 15px;
        white-space: nowrap;
      }

      .brand-kicker,
      .layer-label,
      .eyebrow {
        margin: 0;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
      }

      .global-search {
        display: flex;
        align-items: center;
        width: min(100%, 680px);
        min-height: 40px;
        gap: 9px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--glass-strong);
        color: var(--muted);
        backdrop-filter: blur(18px) saturate(130%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), var(--shadow-soft);
      }

      .global-search:focus-within {
        border-color: var(--accent);
      }

      .global-search svg {
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
      }

      .global-search input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
      }

      .global-search input::placeholder {
        color: var(--subtle);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .icon-button,
      .avatar-button,
      .view-action,
      .select-button {
        display: inline-grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--glass-strong);
        color: var(--text);
        cursor: pointer;
        backdrop-filter: blur(14px);
      }

      .icon-button:hover,
      .avatar-button:hover,
      .view-action:hover,
      .select-button:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      .icon-button svg,
      .view-action svg,
      .select-button svg {
        width: 17px;
        height: 17px;
      }

      .upload-button {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        gap: 7px;
        border: 1px solid var(--accent);
        border-radius: 7px;
        padding: 0 12px;
        background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent-strong) 82%, #64a9e8));
        color: #ffffff;
        font-weight: 750;
        cursor: pointer;
        box-shadow: 0 12px 26px color-mix(in srgb, var(--accent) 24%, transparent);
      }

      .upload-button:hover {
        background: var(--accent-strong);
      }

      .upload-button svg {
        width: 16px;
        height: 16px;
      }

      .avatar-button {
        border: 0;
        background: var(--warm-soft);
        color: var(--warm);
        font-size: 12px;
        font-weight: 800;
      }

      .app-body {
        display: grid;
        grid-template-columns: 246px minmax(0, 1fr);
        min-height: calc(100vh - 68px);
      }

      .channel-rail {
        display: flex;
        flex-direction: column;
        gap: 18px;
        border-right: 1px solid var(--border);
        padding: 24px 16px;
        background: color-mix(in srgb, var(--glass) 78%, transparent);
        backdrop-filter: blur(24px) saturate(135%);
      }

      .channel-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 0 8px;
      }

      .channel-heading h2 {
        margin: 0;
        font-size: 15px;
      }

      .channel-list {
        display: grid;
        gap: 5px;
      }

      .channel-item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto;
        align-items: center;
        width: 100%;
        min-height: 46px;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 7px;
        padding: 0 9px;
        background: transparent;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
      }

      .channel-item:hover {
        background: var(--panel-soft);
        color: var(--text);
      }

      .channel-item[aria-current="true"] {
        border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
        background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--glass-strong) 72%, transparent));
        color: var(--accent-strong);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), var(--shadow-soft);
      }

      .channel-symbol {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--glass-strong);
        color: var(--subtle);
      }

      .channel-item[aria-current="true"] .channel-symbol {
        border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
        color: var(--accent-strong);
      }

      .channel-symbol svg {
        width: 15px;
        height: 15px;
      }

      .channel-name {
        overflow: hidden;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .channel-count {
        color: var(--subtle);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .rail-note {
        margin-top: auto;
        border-top: 1px solid var(--border);
        padding: 16px 8px 0;
      }

      .rail-note p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .workspace {
        min-width: 0;
        padding: 30px 30px 44px;
      }

      .context-header {
        display: grid;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 22px;
      }

      .breadcrumb {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        color: var(--subtle);
        font-size: 12px;
      }

      .breadcrumb svg {
        width: 14px;
        height: 14px;
      }

      .breadcrumb strong {
        color: var(--muted);
        font-weight: 700;
      }

      .title-line {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }

      .page-title {
        margin: 3px 0 0;
        font-size: 25px;
        line-height: 1.22;
      }

      .title-stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 9px;
        background: var(--glass-strong);
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        backdrop-filter: blur(14px);
      }

      .stat-pill strong {
        margin-right: 4px;
        color: var(--text);
      }

      .layer-section {
        padding-top: 22px;
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .section-heading h2 {
        margin: 2px 0 0;
        font-size: 15px;
      }

      .section-note {
        color: var(--subtle);
        font-size: 12px;
      }

      .group-scroller {
        display: grid;
        grid-auto-columns: minmax(150px, 176px);
        grid-auto-flow: column;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: thin;
      }

      .group-card {
        display: grid;
        align-items: stretch;
        min-height: 76px;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 11px 12px;
        background: var(--glass);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        backdrop-filter: blur(18px) saturate(130%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .group-card:hover {
        border-color: color-mix(in srgb, var(--accent) 58%, var(--border));
        box-shadow: var(--shadow);
      }

      .group-card[aria-current="true"] {
        border-color: var(--accent);
        background: linear-gradient(135deg, color-mix(in srgb, var(--accent-soft) 72%, transparent), var(--glass-strong));
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 70%, transparent), var(--shadow-soft);
      }

      .group-copy {
        min-width: 0;
      }

      .group-name {
        overflow: hidden;
        margin: 0;
        font-size: 13px;
        font-weight: 780;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .group-meta,
      .group-count {
        display: block;
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.36;
      }

      .group-meta {
        white-space: normal;
      }

      .group-count strong {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .filter-toolbar {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        align-items: end;
      }

      .filter-search-field {
        grid-column: span 2;
      }

      .field {
        display: grid;
        min-width: 0;
        gap: 5px;
      }

      .field span {
        color: var(--subtle);
        font-size: 11px;
        font-weight: 700;
      }

      .field input,
      .field select {
        width: 100%;
        height: 37px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 12px;
        background: var(--glass-strong);
        color: var(--text);
        backdrop-filter: blur(14px);
      }

      .field input::placeholder {
        color: var(--subtle);
      }

      .field select {
        appearance: auto;
      }

      .clear-filter {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 37px;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 11px;
        background: var(--glass);
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
        backdrop-filter: blur(14px);
      }

      .clear-filter:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      .clear-filter svg {
        width: 15px;
        height: 15px;
      }

      .result-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin: 18px 0 14px;
      }

      .result-summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .result-summary strong {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .summary-separator {
        width: 1px;
        height: 14px;
        background: var(--border);
      }

      .view-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .download-filtered {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 0 10px;
        background: var(--glass-strong);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        backdrop-filter: blur(14px);
      }

      .download-filtered:hover {
        border-color: color-mix(in srgb, var(--accent) 58%, var(--border));
        color: var(--accent-strong);
      }

      .download-filtered:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .download-filtered svg {
        width: 15px;
        height: 15px;
      }

      .view-label {
        color: var(--subtle);
        font-size: 12px;
      }

      .segment-control {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--glass-strong);
        backdrop-filter: blur(14px);
      }

      .segment-control button {
        min-width: 32px;
        height: 32px;
        border: 0;
        border-left: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .segment-control button:first-child {
        border-left: 0;
      }

      .segment-control button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-weight: 800;
      }

      .asset-grid {
        display: grid;
        grid-template-columns: repeat(var(--columns, 6), minmax(0, 1fr));
        gap: 12px;
      }

      .asset-card {
        position: relative;
        display: grid;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--glass);
        cursor: pointer;
        backdrop-filter: blur(18px) saturate(128%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }

      .asset-card:hover {
        border-color: color-mix(in srgb, var(--accent) 58%, var(--border));
        box-shadow: var(--shadow);
      }

      .asset-card.is-selected {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 76%, transparent), var(--shadow-soft);
      }

      .asset-preview {
        position: relative;
        aspect-ratio: 1 / 0.86;
        overflow: hidden;
        border-bottom: 1px solid var(--border);
        background-image: url("./assets/reference-library.png");
        background-repeat: no-repeat;
        background-size: 820% auto;
      }

      .asset-preview.is-uploaded,
      .dialog-image.is-uploaded {
        background-position: center;
        background-size: cover;
      }

      .asset-preview::after {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 26%;
        background: rgba(14, 18, 16, 0.18);
        content: "";
        pointer-events: none;
      }

      .crop-0 { background-position: 0% 28%; }
      .crop-1 { background-position: 13% 28%; }
      .crop-2 { background-position: 27% 28%; }
      .crop-3 { background-position: 41% 28%; }
      .crop-4 { background-position: 55% 28%; }
      .crop-5 { background-position: 69% 28%; }
      .crop-6 { background-position: 83% 28%; }
      .crop-7 { background-position: 100% 28%; }

      .asset-actions {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        display: flex;
        gap: 5px;
        opacity: 0;
        transform: translateY(-3px);
        transition: opacity 130ms ease, transform 130ms ease;
      }

      .asset-card:hover .asset-actions,
      .asset-card:focus-within .asset-actions {
        opacity: 1;
        transform: translateY(0);
      }

      .view-action,
      .select-button {
        width: 30px;
        height: 30px;
        border-color: rgba(255, 255, 255, 0.55);
        background: rgba(19, 24, 22, 0.78);
        color: #ffffff;
      }

      .view-action:hover,
      .select-button:hover {
        border-color: #ffffff;
        color: #ffffff;
      }

      .select-button[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
      }

      .asset-body {
        display: grid;
        min-width: 0;
        gap: 8px;
        padding: 10px;
      }

      .asset-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        min-height: 22px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        min-height: 21px;
        border-radius: 5px;
        padding: 0 6px;
        background: var(--panel-soft);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .tag.role {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .tag.tone {
        background: var(--warm-soft);
        color: var(--warm);
      }

      .asset-name {
        overflow: hidden;
        margin: 0;
        color: var(--text);
        font-size: 12px;
        font-weight: 760;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .asset-detail {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        border-top: 1px solid var(--border);
        padding-top: 8px;
        color: var(--subtle);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .asset-detail span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .empty-state {
        display: grid;
        min-height: 270px;
        place-items: center;
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
        background: color-mix(in srgb, var(--glass) 72%, transparent);
        backdrop-filter: blur(18px);
      }

      .empty-state svg {
        width: 28px;
        height: 28px;
        margin-bottom: 8px;
        color: var(--subtle);
      }

      .empty-state p {
        margin: 0;
      }

      dialog {
        width: min(1060px, calc(100vw - 34px));
        max-height: min(760px, calc(100vh - 34px));
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0;
        background: var(--glass-strong);
        color: var(--text);
        backdrop-filter: blur(24px) saturate(130%);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      dialog::backdrop {
        background: rgba(7, 11, 9, 0.72);
      }

      .dialog-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        min-height: 560px;
      }

      .dialog-image {
        min-height: 0;
        background-image: url("./assets/reference-library.png");
        background-repeat: no-repeat;
        background-size: 700% auto;
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 50;
        max-width: min(360px, calc(100vw - 32px));
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 10px 12px;
        background: var(--panel-strong);
        box-shadow: var(--shadow);
        color: var(--text);
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .dialog-aside {
        display: grid;
        align-content: start;
        gap: 16px;
        border-left: 1px solid var(--border);
        padding: 20px;
      }

      .dialog-aside h2 {
        margin: 0;
        font-size: 17px;
      }

      .dialog-close {
        justify-self: end;
      }

      .dialog-meta {
        display: grid;
        gap: 10px;
        margin: 0;
      }

      .dialog-meta div {
        display: grid;
        gap: 2px;
      }

      .dialog-meta dt {
        color: var(--subtle);
        font-size: 11px;
      }

      .dialog-meta dd {
        margin: 0;
        color: var(--text);
        font-size: 13px;
      }

      .dialog-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .dialog-actions button {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel-soft);
        color: var(--text);
        cursor: pointer;
      }

      .dialog-actions button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .dialog-actions svg {
        width: 15px;
        height: 15px;
      }

      @media (max-width: 1160px) {
        .topbar {
          grid-template-columns: minmax(160px, 210px) minmax(200px, 1fr) auto;
          gap: 14px;
          padding: 12px 18px;
        }

        .app-body {
          grid-template-columns: 208px minmax(0, 1fr);
        }

        .workspace {
          padding: 24px;
        }

        .filter-toolbar {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 850px) {
        .topbar {
          position: relative;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 10px;
        }

        .brand {
          grid-column: 1;
          grid-row: 1;
        }

        .global-search {
          grid-column: 1 / -1;
          grid-row: 2;
          width: 100%;
        }

        .header-actions {
          grid-column: 2;
          grid-row: 1;
        }

        .upload-button span,
        .avatar-button {
          display: none;
        }

        .upload-button {
          width: 36px;
          justify-content: center;
          padding: 0;
        }

        .app-body {
          display: block;
        }

        .channel-rail {
          gap: 10px;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding: 14px 18px;
        }

        .channel-heading {
          padding: 0;
        }

        .channel-list {
          display: flex;
          overflow-x: auto;
          gap: 8px;
          padding-bottom: 2px;
        }

        .channel-item {
          min-width: 132px;
          flex: 0 0 132px;
        }

        .rail-note {
          display: none;
        }

        .workspace {
          padding: 20px 18px 34px;
        }

        .title-line {
          display: grid;
          gap: 12px;
        }

        .title-stats {
          justify-content: flex-start;
        }

        .filter-toolbar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .filter-search-field {
          grid-column: 1 / -1;
        }

        .dialog-layout {
          grid-template-columns: minmax(0, 1fr);
        }

        .dialog-image {
          min-height: 330px;
        }

        .dialog-aside {
          border-top: 1px solid var(--border);
          border-left: 0;
        }
      }

      @media (max-width: 560px) {
        .topbar {
          padding: 12px 14px;
        }

          display: none;
        }

        }

        }

        }

            filename: `${group.spu}_${group.countryCode}_${group.role}_${sku}_${String(number).padStart(2, "0")}.${extension.toLowerCase()}`,
          };
        })
      );

      const state = {
        channel: "Amazon",
        category: "桌类",
        groupId: "amazon-0501-de-main",
        country: "全部",
        role: "全部",
        color: "全部",
        query: "",
        columns: 6,
        selected: new Set(),
        theme: localStorage.getItem("asset-library-theme") || "light",
      };

      const channelList = document.getElementById("channelList");
      const channelScope = document.getElementById("channelScope");
      const groupScroller = document.getElementById("groupScroller");
      const groupCount = document.getElementById("groupCount");
      const breadcrumb = document.getElementById("breadcrumb");
      const pageTitle = document.getElementById("pageTitle");
      const titleStats = document.getElementById("titleStats");
      const assetGrid = document.getElementById("assetGrid");
      const resultSummary = document.getElementById("resultsHeading");
      const downloadFiltered = document.getElementById("downloadFiltered");
      const previewDialog = document.getElementById("previewDialog");
      const dialogImage = document.getElementById("dialogImage");
      const previewTitle = document.getElementById("previewTitle");
      const dialogMeta = document.getElementById("dialogMeta");
      const dialogSelect = document.getElementById("dialogSelect");
      const dialogDownload = document.getElementById("dialogDownload");
      const uploadButton = document.getElementById("uploadButton");
      const uploadInput = document.getElementById("uploadInput");
      const toast = document.getElementById("toast");
      const globalSearch = document.getElementById("globalSearch");
      const filterSearch = document.getElementById("filterSearch");
      const countryFilter = document.getElementById("countryFilter");
      const roleFilter = document.getElementById("roleFilter");
      const colorFilter = document.getElementById("colorFilter");

      function unique(values) {
        return [...new Set(values)];
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        })[character]);
      }

      let toastTimer;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 3200);
      }

      function queryTokens() {
        return state.query
          .trim()
          .toLowerCase()
          .split(/\s+/)
          .filter(Boolean);
      }

      function matchesQuery(haystack, tokens) {
        if (!tokens.length) return true;
        const text = haystack.toLowerCase();
        return tokens.every((token) => text.includes(token));
      }

      function groupUploadedAt(group) {
        return uploadTimeOverrides[group.id] || group.uploadedAt;
      }

      function formatRelativeUploadTime(value) {
        const timestamp = new Date(value).getTime();
        if (!Number.isFinite(timestamp)) return "未知时间";
        const elapsed = Math.max(0, Date.now() - timestamp);
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        if (elapsed < minute) return "刚刚";
        if (elapsed < hour) return `${Math.floor(elapsed / minute)} 分钟前`;
        if (elapsed < day) return `${Math.floor(elapsed / hour)} 小时前`;
        if (elapsed < 2 * day) return "昨天";
        if (elapsed < 30 * day) return `${Math.floor(elapsed / day)} 天前`;
        return new Date(timestamp).toLocaleDateString("zh-CN");
      }

      function groupHaystack(group) {
        return [
          group.channel,
          group.channelLabel,
          group.category,
          group.product,
          group.spu,
          group.country,
          group.countryCode,
          group.role,
          ...group.skus,
          ...group.colors,
        ].join(" ");
      }

      function assetHaystack(asset) {
        return [
          asset.filename,
          asset.channel,
          asset.category,
          asset.product,
          asset.spu,
          asset.sku,
          asset.color,
          asset.country,
          asset.countryCode,
          asset.role,
          asset.tone,
          asset.extension,
          asset.dimensions,
        ].join(" ");
      }

      function groupMatchesQuery(group, tokens) {
        if (matchesQuery(groupHaystack(group), tokens)) return true;
        return assets.some((asset) => asset.groupId === group.id && matchesQuery(assetHaystack(asset), tokens));
      }

      function groupsForCategory(categoryId, withFilters = true) {
        const tokens = queryTokens();
        return groupDefinitions.filter((group) => {
          const inChannel = state.channel === "全部" || group.channel === state.channel;
          const inCategory = group.category === categoryId;
          const inCountry = !withFilters || state.country === "全部" || group.country === state.country;
          const inRole = !withFilters || state.role === "全部" || group.role === state.role;
          return inChannel && inCategory && inCountry && inRole && groupMatchesQuery(group, tokens);
        });
      }

      function visibleGroups() {
        return groupsForCategory(state.category);
      }

      function firstAvailableCategory() {
        return categories.find((category) => groupsForCategory(category.id, false).length)?.id || categories[0].id;
      }

      function normalizeState() {
        if (!categories.some((category) => category.id === state.category)) {
          state.category = categories[0].id;
        }
        if (!groupsForCategory(state.category, false).length) {
          state.category = firstAvailableCategory();
        }

        const baseGroups = groupsForCategory(state.category, false);
        const countries = unique(baseGroups.map((group) => group.country));
        const roles = unique(baseGroups.map((group) => group.role));
        if (state.country !== "全部" && !countries.includes(state.country)) state.country = "全部";
        if (state.role !== "全部" && !roles.includes(state.role)) state.role = "全部";

        const groups = visibleGroups();
        const colors = unique(groups.flatMap((group) => group.colors));
        if (state.color !== "全部" && !colors.includes(state.color)) state.color = "全部";
        state.groupId = groups[0]?.id || "";
      }

      function scopedAssets() {
        const groupIds = new Set(visibleGroups().map((group) => group.id));
        return assets.filter((asset) => groupIds.has(asset.groupId));
      }

      function filteredAssets() {
        const tokens = queryTokens();
        return scopedAssets().filter((asset) => {
          const matchesColor = state.color === "全部" || asset.color === state.color;
          return matchesColor && matchesQuery(assetHaystack(asset), tokens);
        });
      }

      function countByChannel(channel) {
        return channel === "全部" ? assets.length : assets.filter((asset) => asset.channel === channel).length;
      }

      function channelIcon(channel) {
        return channels.find((item) => item.id === channel)?.icon || "folder";
      }

      function renderChannels() {
        channelScope.textContent = `${assets.length} 套`;
        channelList.innerHTML = channels
          .map((channel) => {
            const isActive = state.channel === channel.id;
            return `<button class="channel-item" type="button" data-channel="${channel.id}" aria-current="${isActive}">
              <span class="channel-symbol"><i data-lucide="${channel.icon}" aria-hidden="true"></i></span>
              <span class="channel-name">${channel.label}</span>
              <span class="channel-count">${countByChannel(channel.id)}</span>
            </button>`;
          })
          .join("");
      }

      function renderGroupCards(groups) {
        groupCount.textContent = `${groups.length} 个素材组`;
        const cards = categories.map((category) => {
          const categoryGroups = groupsForCategory(category.id);
          const total = categoryGroups.reduce((sum, group) => sum + group.total, 0);
          const active = category.id === state.category;
          return { ...category, groups: categoryGroups, total, active };
        });
        if (!cards.some((card) => card.groups.length)) {
          groupScroller.innerHTML = `<div class="empty-state"><div><i data-lucide="folder-x" aria-hidden="true"></i><p>当前组合没有匹配的素材组</p></div></div>`;
          return;
        }
        groupScroller.innerHTML = cards
          .map((category) => {
            const disabled = !category.groups.length;
            const roles = unique(category.groups.map((group) => group.role)).join(" / ") || "暂无素材";
            return `<button class="group-card" type="button" data-category="${category.id}" aria-current="${category.active}" ${disabled ? "disabled" : ""}>
              <span class="group-copy">
                <span class="group-name">${category.label} · ${category.groups.length} 个素材组</span>
                <span class="group-meta">${roles}</span>
                <span class="group-count"><strong>${category.total}</strong> 张</span>
              </span>
            </button>`;
          })
          .join("");
      }

      function filterOptions(values, selectedValue, allLabel) {
        return [`<option value="全部">${allLabel}</option>`, ...values.map((value) => `<option value="${value}">${value}</option>`)]
          .map((option) => option.replace(`value="${selectedValue}"`, `value="${selectedValue}" selected`))
          .join("");
      }

      function renderFilterControls() {
        const baseGroups = groupsForCategory(state.category, false);
        const countries = unique(baseGroups.map((group) => group.country));
        const roles = unique(baseGroups.map((group) => group.role));
        const colors = unique(visibleGroups().flatMap((group) => group.colors));
        countryFilter.innerHTML = filterOptions(countries, state.country, "全部国家");
        roleFilter.innerHTML = filterOptions(roles, state.role, "全部图片类型");
        colorFilter.innerHTML = filterOptions(colors, state.color, "全部颜色");
      }

      function syncSearchInputs() {
        if (globalSearch.value !== state.query) globalSearch.value = state.query;
        if (filterSearch.value !== state.query) filterSearch.value = state.query;
      }

      function latestUploadTime(groups) {
        return groups
          .map((group) => new Date(groupUploadedAt(group)).getTime())
          .filter(Number.isFinite)
          .sort((a, b) => b - a)[0];
      }

      function renderContext(groups, filtered) {
        if (!groups.length) {
          breadcrumb.innerHTML = `<span>素材库</span><i data-lucide="chevron-right" aria-hidden="true"></i><strong>无结果</strong>`;
          pageTitle.textContent = "没有匹配的品类素材";
          titleStats.innerHTML = "";
          return;
        }
        const channelLabel = state.channel === "全部" ? "全部渠道" : state.channel;
        const crumbParts = ["素材库", channelLabel, state.category];
        if (state.country !== "全部") crumbParts.push(state.country);
        if (state.role !== "全部") crumbParts.push(state.role);
        breadcrumb.innerHTML = crumbParts
          .map((part, index) => `${index ? '<i data-lucide="chevron-right" aria-hidden="true"></i>' : ""}<strong>${part}</strong>`)
          .join("");
        pageTitle.textContent = `${state.category} · ${channelLabel}`;
        const total = groups.reduce((sum, group) => sum + group.total, 0);
        const colors = unique(groups.flatMap((group) => group.colors));
        const roles = unique(groups.map((group) => group.role));
        const latest = latestUploadTime(groups);
        titleStats.innerHTML = `
          <span class="stat-pill"><strong>${total}</strong>总张数</span>
          <span class="stat-pill"><strong>${colors.length}</strong>种颜色</span>
          <span class="stat-pill"><strong>${groups.length}</strong>个素材组</span>
          <span class="stat-pill">${roles.join(" / ")}</span>
          <span class="stat-pill">更新于 ${formatRelativeUploadTime(latest)}</span>`;
      }

      function assetCard(asset) {
        const selected = state.selected.has(asset.id);
        const previewClass = asset.previewUrl ? " is-uploaded" : "";
        const previewStyle = asset.previewUrl ? ` style="background-image: url('${asset.previewUrl}')"` : "";
        return `<article class="asset-card ${selected ? "is-selected" : ""}" data-asset-id="${asset.id}" tabindex="0">
          <div class="asset-preview crop-${asset.crop}${previewClass}"${previewStyle}>
            <div class="asset-actions">
              <button class="view-action" type="button" data-action="preview" title="预览 ${escapeHtml(asset.filename)}" aria-label="预览 ${escapeHtml(asset.filename)}"><i data-lucide="expand" aria-hidden="true"></i></button>
              <button class="select-button" type="button" data-action="select" aria-pressed="${selected}" title="${selected ? "取消选择" : "选择图片"}" aria-label="${selected ? "取消选择" : "选择图片"}"><i data-lucide="check" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="asset-body">
            <div class="asset-tags">
              <span class="tag">${escapeHtml(asset.countryCode)}</span>
              <span class="tag role">${escapeHtml(asset.role)} ${String(asset.order).padStart(2, "0")}</span>
              <span class="tag tone">${escapeHtml(asset.tone)}</span>
            </div>
            <p class="asset-name">${escapeHtml(asset.color)} · ${escapeHtml(asset.sku)}</p>
            <div class="asset-detail"><span>${escapeHtml(asset.dimensions)}</span><span>${escapeHtml(asset.size)}</span></div>
          </div>
        </article>`;
      }

      function renderGrid(filtered) {
        assetGrid.dataset.columns = String(state.columns);
        assetGrid.style.setProperty("--columns", state.columns);
        if (!filtered.length) {
          assetGrid.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1"><div><i data-lucide="search-x" aria-hidden="true"></i><p>没有符合条件的图片</p></div></div>`;
          return;
        }
        assetGrid.innerHTML = filtered.map(assetCard).join("");
      }

      function renderSummary(group, filtered) {
        const groupTotal = group.reduce((sum, item) => sum + item.total, 0);
        resultSummary.innerHTML = `
          <span><strong>${groupTotal}</strong> 张素材组总数</span>
          <span class="summary-separator" aria-hidden="true"></span>
          <span>筛选 <strong>${filtered.length}</strong> 张</span>
          <span class="summary-separator" aria-hidden="true"></span>
          <span>已选 <strong>${state.selected.size}</strong> 张</span>`;
      }

      function syncDownloadButton(filtered) {
        const selectedCount = state.selected.size;
        const downloadableCount = selectedCount || filtered.length;
        downloadFiltered.disabled = !downloadableCount;
        downloadFiltered.title = downloadableCount ? `下载 ${downloadableCount} 张图片` : "没有可下载的图片";
        downloadFiltered.innerHTML = `<i data-lucide="download" aria-hidden="true"></i><span>${selectedCount ? `下载已选 ${selectedCount} 张` : "下载筛选结果"}</span>`;
      }

      function syncColumnControls() {
        document.querySelectorAll("[data-columns]").forEach((button) => {
          button.setAttribute("aria-pressed", String(Number(button.dataset.columns) === state.columns));
        });
      }

      function render() {
        normalizeState();
        const groups = visibleGroups();
        const filtered = filteredAssets();
        renderChannels();
        renderGroupCards(groups);
        renderFilterControls();
        syncSearchInputs();
        renderContext(groups, filtered);
        renderSummary(groups, filtered);
        renderGrid(filtered);
        syncDownloadButton(filtered);
        syncColumnControls();
        document.body.dataset.theme = state.theme;
        localStorage.setItem("asset-library-theme", state.theme);
        window.lucide?.createIcons();
      }

      function safeFileName(name) {
        return name.replace(/[\\/:*?"<>|]/g, "_").replace(/\.(webp|jpg|jpeg|png)$/i, ".jpg");
      }

      function loadReferenceImage() {
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => resolve(null);
          image.src = "./assets/reference-library.png";
        });
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve) => {
          try {
            canvas.toBlob(resolve, "image/jpeg", 0.92);
          } catch {
            resolve(null);
          }
        });
      }

      async function assetToImageBlob(asset, referenceImage) {
        if (asset.file) return asset.file;
        const canvas = document.createElement("canvas");
        canvas.width = 1600;
        canvas.height = 1600;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f3f5f3";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (referenceImage) {
          const sourceWidth = referenceImage.width / 8;
          const sx = Math.min(asset.crop, 7) * sourceWidth;
          ctx.drawImage(referenceImage, sx, 0, sourceWidth, referenceImage.height, 0, 0, canvas.width, 1120);
        } else {
          ctx.fillStyle = "#dfe8e2";
          ctx.fillRect(0, 0, canvas.width, 1120);
        }

        ctx.fillStyle = "rgba(14, 18, 16, 0.18)";
        ctx.fillRect(0, 900, canvas.width, 220);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 1120, canvas.width, 480);
        ctx.fillStyle = "#0f1b17";
        ctx.font = "700 54px system-ui, -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(`${asset.role} ${String(asset.order).padStart(2, "0")}`, 80, 1240);
        ctx.font = "700 44px system-ui, -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(`${asset.color} · ${asset.sku}`, 80, 1335);
        ctx.fillStyle = "#6c7a73";
        ctx.font = "500 34px system-ui, -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(`${asset.channel} · ${asset.category} · ${asset.countryCode} · ${asset.dimensions}`, 80, 1418);
        ctx.fillText(asset.filename, 80, 1495);
        const blob = await canvasToBlob(canvas);
        if (blob) return blob;
        if (referenceImage) return assetToImageBlob(asset, null);
        return new Blob([], { type: "image/jpeg" });
      }

      async function downloadFilteredAssets() {
        const filtered = filteredAssets();
        const selectedAssets = assets.filter((asset) => state.selected.has(asset.id));
        const assetsToDownload = selectedAssets.length ? selectedAssets : filtered;
        if (!assetsToDownload.length) return;
        if (!window.JSZip) {
          window.alert("下载组件未加载完成，请稍后刷新页面再试。");
          return;
        }

        const originalLabel = downloadFiltered.innerHTML;
        downloadFiltered.disabled = true;
        downloadFiltered.innerHTML = '<i data-lucide="loader-circle" aria-hidden="true"></i><span>打包中</span>';
        window.lucide?.createIcons();

        try {
          const zip = new window.JSZip();
          const referenceImage = await loadReferenceImage();
          for (const asset of assetsToDownload) {
            const blob = await assetToImageBlob(asset, referenceImage);
            zip.file(safeFileName(asset.filename), blob);
          }
          const zipBlob = await zip.generateAsync({ type: "blob" });
          const url = URL.createObjectURL(zipBlob);
          const link = document.createElement("a");
          const scope = `${state.channel === "全部" ? "全部渠道" : state.channel}_${state.category}_${assetsToDownload.length}张`;
          link.href = url;
          link.download = `${scope}_${selectedAssets.length ? "已选" : "筛选"}图片.zip`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          showToast(`已开始下载 ${assetsToDownload.length} 张图片`);
        } finally {
          downloadFiltered.innerHTML = originalLabel;
          syncDownloadButton(filteredAssets());
          window.lucide?.createIcons();
        }
      }

      function selectAsset(id) {
        if (state.selected.has(id)) state.selected.delete(id);
        else state.selected.add(id);
        render();
      }

      function openPreview(id) {
        const asset = assets.find((item) => item.id === id);
        if (!asset) return;
        const assetGroup = groupDefinitions.find((group) => group.id === asset.groupId);
        dialogImage.className = `dialog-image crop-${asset.crop}${asset.previewUrl ? " is-uploaded" : ""}`;
        dialogImage.style.backgroundImage = asset.previewUrl ? `url("${asset.previewUrl}")` : "";
        previewTitle.textContent = `${asset.color} · ${asset.role} ${String(asset.order).padStart(2, "0")}`;
        dialogMeta.innerHTML = `
          <div><dt>SPU</dt><dd>${asset.product} · ${asset.spu}</dd></div>
          <div><dt>投放范围</dt><dd>${asset.channel} · ${assetGroup?.category || ""} · ${asset.country} · ${asset.role}</dd></div>
          <div><dt>颜色 / 光调</dt><dd>${asset.color} · ${asset.tone}</dd></div>
          <div><dt>规格</dt><dd>${asset.dimensions} · ${asset.extension} · ${asset.size}</dd></div>
          <div><dt>文件名</dt><dd>${escapeHtml(asset.filename)}</dd></div>`;
        dialogSelect.dataset.assetId = asset.id;
        dialogDownload.dataset.assetId = asset.id;
        dialogSelect.innerHTML = state.selected.has(asset.id)
          ? '<i data-lucide="minus" aria-hidden="true"></i>取消选择'
          : '<i data-lucide="check" aria-hidden="true"></i>选择';
        previewDialog.showModal();
        window.lucide?.createIcons();
      }

      channelList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-channel]");
        if (!button) return;
        state.channel = button.dataset.channel;
        state.country = "全部";
        state.role = "全部";
        state.color = "全部";
        state.category = firstAvailableCategory();
        render();
      });

      groupScroller.addEventListener("click", (event) => {
        const card = event.target.closest("[data-category]");
        if (!card) return;
        state.category = card.dataset.category;
        state.country = "全部";
        state.role = "全部";
        state.color = "全部";
        render();
      });

      assetGrid.addEventListener("click", (event) => {
        const card = event.target.closest("[data-asset-id]");
        if (!card) return;
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "select") {
          selectAsset(card.dataset.assetId);
          return;
        }
        openPreview(card.dataset.assetId);
      });

      assetGrid.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest("[data-asset-id]");
        if (!card) return;
        event.preventDefault();
        openPreview(card.dataset.assetId);
      });

      function applySearch(value, useGlobalScope) {
        state.query = value;
        if (useGlobalScope && state.query.trim()) {
          state.channel = "全部";
          state.country = "全部";
          state.role = "全部";
          state.color = "全部";
          state.category = firstAvailableCategory();
        }
        render();
      }

      globalSearch.addEventListener("input", (event) => {
        applySearch(event.target.value, true);
      });

      filterSearch.addEventListener("input", (event) => {
        applySearch(event.target.value, false);
      });

      countryFilter.addEventListener("change", (event) => {
        state.country = event.target.value;
        state.color = "全部";
        render();
      });

      roleFilter.addEventListener("change", (event) => {
        state.role = event.target.value;
        state.color = "全部";
        render();
      });

      colorFilter.addEventListener("change", (event) => {
        state.color = event.target.value;
        render();
      });

      [globalSearch, filterSearch].forEach((input) => {
        input.addEventListener("search", (event) => {
          applySearch(event.target.value, input === globalSearch);
        });
      });

      document.getElementById("clearFilters").addEventListener("click", () => {
        state.country = "全部";
        state.role = "全部";
        state.color = "全部";
        state.query = "";
        globalSearch.value = "";
        filterSearch.value = "";
        render();
      });

      document.querySelector(".segment-control").addEventListener("click", (event) => {
        const button = event.target.closest("[data-columns]");
        if (!button) return;
        state.columns = Number(button.dataset.columns);
        render();
      });

      downloadFiltered.addEventListener("click", downloadFilteredAssets);

      uploadButton.addEventListener("click", () => {
        uploadInput.click();
      });

      uploadInput.addEventListener("change", () => {
        const groups = visibleGroups();
        if (!uploadInput.files.length || !groups.length) return;
        const targetGroup = groups[0];
        const uploadedAt = new Date().toISOString();
        const existingOrders = assets.filter((asset) => asset.groupId === targetGroup.id).map((asset) => asset.order);
        const startingOrder = existingOrders.length ? Math.max(...existingOrders) : 0;
        [...uploadInput.files].forEach((file, index) => {
          const extension = (file.name.split(".").pop() || "jpg").toUpperCase();
          const filename = file.name || `上传素材_${index + 1}.${extension.toLowerCase()}`;
          assets.push({
            id: `${targetGroup.id}-upload-${Date.now()}-${index}`,
            groupId: targetGroup.id,
            channel: targetGroup.channel,
            category: targetGroup.category,
            product: targetGroup.product,
            spu: targetGroup.spu,
            country: targetGroup.country,
            countryCode: targetGroup.countryCode,
            role: targetGroup.role,
            sku: targetGroup.skus[0],
            color: targetGroup.colors[0],
            tone: "上传",
            extension,
            size: `${Math.max(1, Math.round(file.size / 1024))} KB`,
            dimensions: "原始尺寸",
            order: startingOrder + index + 1,
            crop: 0,
            filename,
            file,
            previewUrl: URL.createObjectURL(file),
          });
        });
        targetGroup.total += uploadInput.files.length;
        uploadTimeOverrides[targetGroup.id] = uploadedAt;
        localStorage.setItem(uploadTimeStorageKey, JSON.stringify(uploadTimeOverrides));
        showToast(`已上传 ${uploadInput.files.length} 张图片至 ${targetGroup.product} · ${targetGroup.role}`);
        uploadInput.value = "";
        render();
      });

      document.getElementById("themeToggle").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        render();
      });

      document.getElementById("dialogClose").addEventListener("click", () => previewDialog.close());
      dialogSelect.addEventListener("click", () => {
        selectAsset(dialogSelect.dataset.assetId);
        openPreview(dialogSelect.dataset.assetId);
      });

      dialogDownload.addEventListener("click", async () => {
        const asset = assets.find((item) => item.id === dialogDownload.dataset.assetId);
        if (!asset) return;
        const blob = await assetToImageBlob(asset, await loadReferenceImage());
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = safeFileName(asset.filename);
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showToast("已开始下载原图");
      });

      previewDialog.addEventListener("click", (event) => {
        if (event.target === previewDialog) previewDialog.close();
      });

      render();
    </script>
  </body>
</html>
